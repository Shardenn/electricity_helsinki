name: Electricity prices

on:
  schedule:
    # Runs every 10 minutes; the script itself decides whether it's time to send
    # (notification time is stored in state.json and changed by messaging the bot).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # to commit state.json back to the repo

concurrency:
  group: electricity-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python electricity_prices.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HELEN_MARGIN: ${{ vars.HELEN_MARGIN }}
          HOURS_COUNT: ${{ vars.HOURS_COUNT }}
      - name: Save state
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update state" state.json
            git push
          fi
